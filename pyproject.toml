[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mh-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over Monster Hunter wiki and Wikipedia pages"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["rag"]

[tool.setuptools.dynamic]
# One list of pinned versions, shared with `pip install -r requirements.txt`
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
